<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Selection</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://uploads.onecompiler.io/437muad7y/1790788169993/cropped_circle_image%20(1).png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://uploads.onecompiler.io/437muad7y/1790788169993/cropped_circle_image%20(1).png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://uploads.onecompiler.io/437muad7y/1790788169993/cropped_circle_image%20(1).png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .selection-panel {
            text-align: center;
        }
        .vertical-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }
        .vertical-buttons button {
            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            background-color: #ada107;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
        .vertical-buttons button:hover {
            background-color: #1a4a8a;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #173866;
        }
    </style>
</head>
<body>
    <div class="logo">
        <a href="https://www.unicas.it/" target="_blank">
            <img src="https://uploads.onecompiler.io/437muad7y/1790786528472/unicas.png" alt="UNICAS LOGO" width="150">
        </a>
    </div>
    <header>
        <h1>University of Cassino and Southern Lazio</h1>
        <p>Platform to manage your academic journey and access educational resources.</p>
    </header>

    <main>
        <div class="selection-panel">
            <div class="section-title">Choose Your Semester</div>
            <div class="vertical-buttons">
                <button onclick="window.location.href='s1.html'">Semester 1</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2027' BEN. MOH-REDA</p>
    </footer>
</body>
</html>
